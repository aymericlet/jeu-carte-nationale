<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carte Nationale</title>

    <style>

        /* =========================================================
           RÉGLAGES GÉNÉRAUX
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            min-height: 100%;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f5f6f8;

            color: #333333;
        }


        body {
            min-height: 100vh;
        }


        /* =========================================================
           PAGE D'ACCUEIL
           ========================================================= */

        .page-accueil {
            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* =========================================================
           EN-TÊTE
           ========================================================= */

        .entete {
            width: 100%;

            padding:
                32px
                20px
                18px;

            text-align: center;
        }


        .entete h1 {
            margin: 0;

            color: #94163a;

            font-size: clamp(
                42px,
                4vw,
                68px
            );

            font-weight: 700;

            line-height: 1.05;
        }


        .entete p {
            margin:
                14px
                0
                0;

            color: #444444;

            font-size: clamp(
                18px,
                1.5vw,
                26px
            );

            line-height: 1.3;
        }


        /* =========================================================
           CONTENU PRINCIPAL
           ========================================================= */

        .contenu {
            width: 100%;

            flex: 1;

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(420px, 0.75fr);

            align-items: center;

            gap: clamp(
                30px,
                5vw,
                90px
            );

            padding:
                10px
                clamp(30px, 5vw, 90px)
                35px;
        }


        /* =========================================================
           ZONE DE LA CARTE
           ========================================================= */

        .zone-carte {
            width: 100%;
            height: 100%;

            min-width: 0;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        .carte-france {
            display: block;

            width: auto;

            height: min(
                67vh,
                680px
            );

            max-width: 100%;

            object-fit: contain;

            user-select: none;

            -webkit-user-drag: none;

            filter:
                drop-shadow(
                    0 12px 20px
                    rgba(0, 0, 0, 0.08)
                );
        }


        /* =========================================================
           MENU
           ========================================================= */

        .zone-menu {
            width: 100%;

            display: flex;

            justify-content: center;
            align-items: center;
        }


        .menu {
            width: min(
                100%,
                520px
            );

            display: flex;

            flex-direction: column;

            gap: 20px;
        }


        /* =========================================================
           BOUTONS
           ========================================================= */

        .bouton-menu {
            width: 100%;

            min-height: 82px;

            border: none;

            border-radius: 17px;

            background: #94163a;

            color: #ffffff;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 10px;

            padding:
                18px
                25px;

            font-size: clamp(
                18px,
                1.35vw,
                24px
            );

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 6px 16px
                rgba(148, 22, 58, 0.10);

            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease,
                background 0.15s ease;
        }


        .bouton-menu:hover {
            background: #7f1130;

            transform:
                translateY(-2px);

            box-shadow:
                0 9px 20px
                rgba(148, 22, 58, 0.18);
        }


        .bouton-menu:active {
            transform:
                translateY(0);
        }


        .icone-bouton {
            display: inline-flex;

            justify-content: center;
            align-items: center;

            min-width: 28px;

            font-size: 22px;
        }


        /* =========================================================
           TABLETTES
           ========================================================= */

        @media (max-width: 1050px) {

            .contenu {
                grid-template-columns:
                    minmax(0, 1fr)
                    minmax(330px, 0.75fr);

                gap: 30px;

                padding-left: 25px;
                padding-right: 25px;
            }


            .carte-france {
                height: min(
                    60vh,
                    600px
                );
            }


            .bouton-menu {
                min-height: 72px;
            }

        }


        /* =========================================================
           TÉLÉPHONES / PETITS ÉCRANS
           ========================================================= */

        @media (max-width: 760px) {

            .entete {
                padding:
                    24px
                    15px
                    10px;
            }


            .entete h1 {
                font-size: 38px;
            }


            .entete p {
                font-size: 17px;
            }


            .contenu {
                display: flex;

                flex-direction: column;

                gap: 25px;

                padding:
                    15px
                    18px
                    30px;
            }


            .zone-carte {
                width: 100%;
            }


            .carte-france {
                width: 100%;

                height: auto;

                max-height: 58vh;
            }


            .zone-menu {
                width: 100%;
            }


            .menu {
                width: 100%;

                gap: 14px;
            }


            .bouton-menu {
                min-height: 65px;

                border-radius: 14px;

                font-size: 18px;
            }

        }


        /* =========================================================
           TRÈS PETITS TÉLÉPHONES
           ========================================================= */

        @media (max-width: 420px) {

            .entete h1 {
                font-size: 32px;
            }


            .entete p {
                font-size: 16px;
            }


            .contenu {
                padding-left: 12px;
                padding-right: 12px;
            }


            .bouton-menu {
                min-height: 60px;

                padding:
                    14px
                    15px;
            }

        }

    </style>

</head>


<body>


    <main class="page-accueil">


        <!-- =====================================================
             TITRE
             ===================================================== -->

        <header class="entete">

            <h1>
                Carte Nationale
            </h1>

            <p>
                Apprends à situer les villes du réseau ferroviaire.
            </p>

        </header>


        <!-- =====================================================
             CARTE + MENU
             ===================================================== -->

        <section class="contenu">


            <!-- CARTE -->

            <div class="zone-carte">

                <img
                    src="images/carte-nationale-FINALE-transparente.png"
                    alt="Carte nationale du réseau ferroviaire"
                    class="carte-france"
                    draggable="false"
                >

            </div>


            <!-- MENU -->

            <div class="zone-menu">

                <div class="menu">


                    <!-- MODE APPRENTISSAGE -->

                    <button
                        id="btnApprendre"
                        class="bouton-menu"
                        type="button"
                    >

                        <span class="icone-bouton">
                            🎓
                        </span>

                        <span>
                            Apprendre
                        </span>

                    </button>


                    <!-- MODE JEU -->

                    <button
                        id="btnJouer"
                        class="bouton-menu"
                        type="button"
                    >

                        <span class="icone-bouton">
                            🎮
                        </span>

                        <span>
                            Jouer
                        </span>

                    </button>


                    <!-- MODE EXAMEN -->

                    <button
                        id="btnExamen"
                        class="bouton-menu"
                        type="button"
                    >

                        <span class="icone-bouton">
                            🏆
                        </span>

                        <span>
                            Mode Examen
                        </span>

                    </button>


                </div>

            </div>


        </section>


    </main>


    <script>

        /* =========================================================
           BOUTONS DE L'ACCUEIL
           ========================================================= */


        const btnApprendre =
            document.getElementById(
                "btnApprendre"
            );


        const btnJouer =
            document.getElementById(
                "btnJouer"
            );


        const btnExamen =
            document.getElementById(
                "btnExamen"
            );


        /* ---------------------------------------------------------
           APPRENDRE
           --------------------------------------------------------- */

        btnApprendre.addEventListener(
            "click",
            function() {

                window.location.href = "apprendre.html";

            }
        );


        /* ---------------------------------------------------------
           JOUER
           --------------------------------------------------------- */

        btnJouer.addEventListener(
            "click",
            function() {

                window.location.href = "jouer.html";

            }
        );


        /* ---------------------------------------------------------
           EXAMEN
           --------------------------------------------------------- */

        btnExamen.addEventListener(
            "click",
            function() {

                window.location.href = "examen.html";

            }
        );

    </script>


</body>

</html>
