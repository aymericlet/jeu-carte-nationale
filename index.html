<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GéoRail - Révise en jouant</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f6f8;
    color: #333;
}

body {
    height: 100vh;
}

button {
    font: inherit;
}

.page {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.entete {
    padding: 24px 20px 18px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

.entete h1 {
    margin: 0;
    color: #94163a;
    font-size: clamp(32px, 4vw, 48px);
    line-height: 1;
}

.entete p {
    margin: 9px 0 0;
    color: #666;
    font-size: 15px;
}

.contenu {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
}

.bloc-choix {
    width: min(1050px, 100%);
}

.titre-choix {
    margin: 0 0 22px;
    color: #333;
    font-size: 25px;
    text-align: center;
}

.grille-cartes {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 24px;
}

.carte-choix {
    min-width: 0;
    height: 100%;
    padding: 0;
    overflow: hidden;
    display: grid;
    grid-template-rows: 340px 1fr;
    border: 1px solid #dedede;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 10px 28px rgba(0,0,0,.07);
    cursor: pointer;
    text-align: left;
    transition:
        transform .15s ease,
        box-shadow .15s ease,
        border-color .15s ease;
}

.carte-choix:hover {
    transform: translateY(-4px);
    border-color: #94163a;
    box-shadow: 0 15px 34px rgba(0,0,0,.11);
}

.zone-image {
    height: 100%;
    padding: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafafa;
    border-bottom: 1px solid #eee;
}

.zone-image img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
}

.infos {
    display: flex;
    flex-direction: column;
    min-height: 164px;
    padding: 20px 22px 30px;
}

.nom-carte {
    display: block;
    margin-bottom: 7px;
    color: #94163a;
    font-size: 24px;
    font-weight: 800;
}

.description {
    display: block;
    color: #666;
    font-size: 14px;
    line-height: 1.45;
}

.action {
    display: inline-block;
    margin-top: auto;
    padding-top: 15px;
    color: #94163a;
    font-size: 13px;
    font-weight: 800;
}

.ecran-modes {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    z-index: 100;
    display: none;
    flex-direction: column;
    overflow: hidden;
    background: #f5f6f8;
}

.ecran-modes.visible {
    display: flex;
}

.entete-modes {
    min-height: 76px;
    padding: 10px 28px;
    display: grid;
    grid-template-columns: 180px 1fr 180px;
    align-items: center;
    background: #fff;
    border-bottom: 1px solid #ddd;
}

.zone-retour {
    display: flex;
    justify-content: flex-start;
}

.btn-retour {
    min-height: 42px;
    padding: 8px 18px;
    border: 0;
    border-radius: 11px;
    background: #94163a;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.btn-retour:hover {
    background: #7f1130;
}

.titre-mode {
    text-align: center;
}

.titre-mode h1 {
    margin: 0;
    color: #94163a;
    font-size: clamp(26px, 2.5vw, 38px);
}

.titre-mode p {
    margin: 5px 0 0;
    color: #666;
    font-size: 14px;
}

.contenu-modes {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
}


/* =========================================================
   ÉCRAN DE SÉLECTION DES RÉGIONS
   Permet d'afficher et de faire défiler toutes les cartes.
   ========================================================= */
#ecranRegions {
    overflow: hidden;
}

#ecranRegions .entete-modes {
    flex: 0 0 76px;
    min-height: 76px;
}

#ecranRegions .contenu-modes {
    flex: 1 1 auto;
    min-height: 0;
    align-items: flex-start;
    overflow-x: hidden;
    overflow-y: auto;
    padding-bottom: 40px;
}

#ecranRegions .bloc-choix {
    margin: 0 auto;
    padding-bottom: 12px;
}

.selection-mode {
    width: min(900px, 100%);
    padding: 28px;
    border: 1px solid #e1e1e1;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 12px 32px rgba(0,0,0,.08);
}

.apercu-carte {
    height: 230px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.apercu-carte img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
}

.grille-modes {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
}

.bouton-mode {
    min-height: 120px;
    padding: 18px;
    border: 1px solid #e1e1e1;
    border-radius: 15px;
    background: #fff;
    cursor: pointer;
    text-align: center;
    transition:
        transform .12s ease,
        box-shadow .12s ease,
        border-color .12s ease;
}

.bouton-mode:hover {
    transform: translateY(-2px);
    border-color: #94163a;
    box-shadow: 0 8px 20px rgba(0,0,0,.08);
}

.icone-mode {
    display: block;
    margin-bottom: 9px;
    font-size: 30px;
}

.nom-mode {
    display: block;
    color: #94163a;
    font-size: 19px;
    font-weight: 800;
}

.texte-mode {
    display: block;
    margin-top: 6px;
    color: #666;
    font-size: 12px;
    line-height: 1.4;
}


/* CARTOUCHES DES FUTURES CARTES RÉGIONALES */
.carte-region-a-venir {
    min-width: 0;
    min-height: 504px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border: 2px dashed #d8d8d8;
    border-radius: 20px;
    background: rgba(255,255,255,.55);
    color: #aaa;
    text-align: center;
    cursor: default;
}

.icone-region-a-venir {
    font-size: 46px;
    line-height: 1;
    filter: grayscale(1);
    opacity: .65;
}

.texte-region-a-venir {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.2;
}


@media (max-width: 760px) {
    /* =====================================================
       VERSION MOBILE — ACCUEIL
       La version ordinateur reste inchangée.
       ===================================================== */

    .entete {
        flex: 0 0 auto;
        padding: 12px 10px 10px;
    }

    .entete h1 {
        font-size: 30px;
        line-height: 1;
    }

    .entete p {
        margin-top: 6px;
        padding: 0 8px;
        font-size: 13px;
        line-height: 1.3;
    }

    .contenu {
        flex: 1 1 auto;
        min-height: 0;
        align-items: flex-start;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 14px 12px 22px;
        -webkit-overflow-scrolling: touch;
    }

    .bloc-choix {
        width: 100%;
    }

    .titre-choix {
        margin: 4px 0 12px;
        font-size: 22px;
    }

    .grille-cartes {
        grid-template-columns: 1fr;
        gap: 12px;
    }

    .carte-choix {
        grid-template-columns: 125px minmax(0, 1fr);
        grid-template-rows: 1fr;
        min-height: 154px;
        border-radius: 16px;
    }

    .zone-image {
        height: 100%;
        min-height: 154px;
        padding: 12px;
        border-bottom: 0;
        border-right: 1px solid #eee;
    }

    .infos {
        min-height: 0;
        padding: 15px 14px;
        justify-content: center;
    }

    .nom-carte {
        font-size: 19px;
        line-height: 1.15;
    }

    .description {
        margin-top: 7px;
        font-size: 13px;
        line-height: 1.35;
    }

    .action {
        margin-top: 11px;
        padding-top: 0;
        font-size: 13px;
    }


    /* =====================================================
       ÉCRANS PLEIN ÉCRAN : RÉGIONS + CHOIX DU MODE
       ===================================================== */

    .ecran-modes {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
    }

    .entete-modes,
    #ecranRegions .entete-modes {
        flex: 0 0 auto;
        min-height: 0;
        padding: 10px 12px 11px;
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .titre-mode {
        order: 1;
        width: 100%;
    }

    .titre-mode h1 {
        font-size: 25px;
        line-height: 1.1;
    }

    .titre-mode p {
        margin-top: 4px;
        font-size: 13px;
    }

    .zone-retour {
        order: 2;
        width: 100%;
        justify-content: center;
    }

    .entete-modes > div:last-child {
        display: none;
    }

    .btn-retour {
        min-height: 36px;
        padding: 7px 16px;
        border-radius: 10px;
        font-size: 14px;
    }

    .contenu-modes,
    #ecranRegions .contenu-modes {
        flex: 1 1 auto;
        min-height: 0;
        align-items: flex-start;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 12px;
        padding-bottom: 24px;
        -webkit-overflow-scrolling: touch;
    }


    /* =====================================================
       CHOIX APPRENDRE / JOUER / EXAMEN
       ===================================================== */

    .selection-mode {
        width: 100%;
        padding: 14px;
        border-radius: 16px;
    }

    .apercu-carte {
        height: 118px;
        margin-bottom: 12px;
    }

    .grille-modes {
        grid-template-columns: 1fr;
        gap: 9px;
    }

    .bouton-mode {
        min-height: 72px;
        padding: 11px 14px;
        display: grid;
        grid-template-columns: 42px 1fr;
        grid-template-rows: auto auto;
        column-gap: 10px;
        align-items: center;
        text-align: left;
        border-radius: 13px;
    }

    .icone-mode {
        grid-column: 1;
        grid-row: 1 / 3;
        margin: 0;
        font-size: 28px;
        text-align: center;
    }

    .nom-mode {
        grid-column: 2;
        grid-row: 1;
        align-self: end;
        font-size: 18px;
        line-height: 1.1;
    }

    .texte-mode {
        grid-column: 2;
        grid-row: 2;
        align-self: start;
        margin-top: 3px;
        font-size: 12px;
        line-height: 1.3;
    }


    /* =====================================================
       SÉLECTION DES CARTES RÉGIONALES
       ===================================================== */

    #ecranRegions .bloc-choix {
        width: 100%;
        margin: 0;
        padding-bottom: 0;
    }

    #ecranRegions .grille-cartes {
        gap: 10px;
    }

    #ecranRegions .carte-choix {
        min-height: 154px;
    }

    #ecranRegions .carte-region-a-venir {
        min-height: 82px;
        padding: 12px;
        flex-direction: row;
        gap: 10px;
        border-radius: 14px;
    }

    .icone-region-a-venir {
        font-size: 27px;
    }

    .texte-region-a-venir {
        font-size: 16px;
        line-height: 1.15;
    }

    .texte-region-a-venir br {
        display: none;
    }
}


/* =========================================================
   TÉLÉPHONE EN PAYSAGE
   ========================================================= */
@media (max-height: 500px) and (orientation: landscape) {
    .entete {
        padding: 7px 12px 6px;
    }

    .entete h1 {
        font-size: 25px;
    }

    .entete p {
        margin-top: 3px;
        font-size: 11px;
    }

    .contenu {
        padding: 8px 12px 14px;
    }

    .titre-choix {
        margin: 2px 0 8px;
        font-size: 19px;
    }

    .grille-cartes {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
    }

    .carte-choix {
        grid-template-columns: 105px minmax(0, 1fr);
        min-height: 126px;
    }

    .zone-image {
        min-height: 126px;
        padding: 9px;
    }

    .infos {
        padding: 10px;
    }

    .nom-carte {
        font-size: 16px;
    }

    .description {
        margin-top: 4px;
        font-size: 11px;
    }

    .action {
        margin-top: 6px;
        font-size: 11px;
    }

    .entete-modes,
    #ecranRegions .entete-modes {
        padding: 6px 12px;
        display: grid;
        grid-template-columns: 120px 1fr 120px;
        align-items: center;
        gap: 0;
    }

    .zone-retour {
        order: initial;
        grid-column: 1;
        grid-row: 1;
        justify-content: flex-start;
    }

    .titre-mode {
        order: initial;
        grid-column: 2;
        grid-row: 1;
    }

    .titre-mode h1 {
        font-size: 21px;
    }

    .titre-mode p {
        margin-top: 2px;
        font-size: 11px;
    }

    .btn-retour {
        min-height: 32px;
        padding: 5px 12px;
        font-size: 12px;
    }

    .contenu-modes,
    #ecranRegions .contenu-modes {
        padding: 8px 12px 12px;
    }

    .selection-mode {
        width: min(820px, 100%);
        margin: 0 auto;
        padding: 10px;
    }

    .apercu-carte {
        height: 82px;
        margin-bottom: 8px;
    }

    .grille-modes {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .bouton-mode {
        min-height: 68px;
        padding: 8px;
        display: block;
        text-align: center;
    }

    .icone-mode {
        display: inline;
        margin: 0 5px 0 0;
        font-size: 20px;
    }

    .nom-mode {
        display: inline;
        font-size: 15px;
    }

    .texte-mode {
        display: block;
        margin-top: 4px;
        font-size: 10px;
    }

    #ecranRegions .grille-cartes {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    #ecranRegions .carte-region-a-venir {
        min-height: 70px;
    }
}
</style>
</head>

<body>

<main class="page">
    <header class="entete">
        <h1>🚆 GéoRail</h1>
        <p>Apprends et teste tes connaissances du réseau ferroviaire.</p>
    </header>

    <section class="contenu">
        <div class="bloc-choix">
            <h2 class="titre-choix">Choisis ta carte</h2>

            <div class="grille-cartes">

                <button id="btnCarteNationale" class="carte-choix" type="button">
                    <span class="zone-image">
                        <img
                            src="images/carte-nationale-mini.png"
                            alt="Carte nationale du réseau ferroviaire"
                            draggable="false"
                        >
                    </span>

                    <span class="infos">
                        <span class="nom-carte">🇫🇷 Carte nationale</span>
                        <span class="description">
                            Entraîne-toi sur l'ensemble de la carte nationale.
                        </span>
                        <span class="action">Choisir cette carte →</span>
                    </span>
                </button>

                <button id="btnCartesRegionales" class="carte-choix" type="button">
                    <span class="zone-image">
                        <img
                            src="images/carte-france-regions-mini.png"
                            alt="Carte de France découpée en régions"
                            draggable="false"
                        >
                    </span>

                    <span class="infos">
                        <span class="nom-carte">🗺️ Cartes régionales</span>
                        <span class="description">
                            Entraîne-toi sur les différentes cartes régionales.
                        </span>
                        <span class="action">Voir les cartes régionales →</span>
                    </span>
                </button>

            </div>
        </div>
    </section>
</main>

<div id="ecranRegions" class="ecran-modes">
    <header class="entete-modes">
        <div class="zone-retour">
            <button id="btnRetourAccueilRegions" class="btn-retour" type="button">
                ← Retour
            </button>
        </div>

        <div class="titre-mode">
            <h1>Choisis ta carte régionale</h1>
            <p>Sélectionne une région.</p>
        </div>

        <div></div>
    </header>

    <section class="contenu-modes">
        <div class="bloc-choix">
            <div class="grille-cartes">

                <button id="btnRegionRhoneAlpes" class="carte-choix" type="button">
                    <span class="zone-image">
                        <img
                            src="images/carte-rhone-alpes-mini.png"
                            alt="Carte Rhône-Alpes du réseau ferroviaire"
                            draggable="false"
                        >
                    </span>

                    <span class="infos">
                        <span class="nom-carte">🏔️ Rhône-Alpes</span>
                        <span class="description">
                            Entraîne-toi sur les 82 villes de la carte Rhône-Alpes.
                        </span>
                        <span class="action">Choisir cette carte →</span>
                    </span>
                </button>

                <div class="carte-region-a-venir" aria-label="Autre région à venir">
                    <span class="icone-region-a-venir">📍</span>
                    <span class="texte-region-a-venir">Autre région<br>à venir</span>
                </div>

                <div class="carte-region-a-venir" aria-label="Autre région à venir">
                    <span class="icone-region-a-venir">📍</span>
                    <span class="texte-region-a-venir">Autre région<br>à venir</span>
                </div>

                <div class="carte-region-a-venir" aria-label="Autre région à venir">
                    <span class="icone-region-a-venir">📍</span>
                    <span class="texte-region-a-venir">Autre région<br>à venir</span>
                </div>

            </div>
        </div>
    </section>
</div>

<div id="ecranModes" class="ecran-modes">
    <header class="entete-modes">
        <div class="zone-retour">
            <button id="btnRetourCartes" class="btn-retour" type="button">
                ← Cartes
            </button>
        </div>

        <div class="titre-mode">
            <h1 id="titreCarteSelectionnee">Carte</h1>
            <p>Choisis ton mode.</p>
        </div>

        <div></div>
    </header>

    <section class="contenu-modes">
        <div class="selection-mode">

            <div class="apercu-carte">
                <img id="imageCarteSelectionnee" src="" alt="" draggable="false">
            </div>

            <div class="grille-modes">

                <button id="btnApprendre" class="bouton-mode" type="button">
                    <span class="icone-mode">🎓</span>
                    <span class="nom-mode">Apprendre</span>
                    <span class="texte-mode">
                        Découvre les villes et entraîne-toi à les reconnaître.
                    </span>
                </button>

                <button id="btnJouer" class="bouton-mode" type="button">
                    <span class="icone-mode">🎮</span>
                    <span class="nom-mode">Jouer</span>
                    <span class="texte-mode">
                        Retrouve les villes sur la carte avec plusieurs niveaux.
                    </span>
                </button>

                <button id="btnExamen" class="bouton-mode" type="button">
                    <span class="icone-mode">🏆</span>
                    <span class="nom-mode">Mode Examen</span>
                    <span class="texte-mode">
                        Teste tes connaissances sur 21 villes aléatoires.
                    </span>
                </button>

            </div>
        </div>
    </section>
</div>

<script>
const btnCarteNationale =
    document.getElementById("btnCarteNationale");

const btnCartesRegionales =
    document.getElementById("btnCartesRegionales");

const ecranRegions =
    document.getElementById("ecranRegions");

const btnRetourAccueilRegions =
    document.getElementById("btnRetourAccueilRegions");

const btnRegionRhoneAlpes =
    document.getElementById("btnRegionRhoneAlpes");

const ecranModes =
    document.getElementById("ecranModes");

const btnRetourCartes =
    document.getElementById("btnRetourCartes");

const titreCarteSelectionnee =
    document.getElementById("titreCarteSelectionnee");

const imageCarteSelectionnee =
    document.getElementById("imageCarteSelectionnee");

const btnApprendre =
    document.getElementById("btnApprendre");

const btnJouer =
    document.getElementById("btnJouer");

const btnExamen =
    document.getElementById("btnExamen");

let carteSelectionnee = null;

const CONFIG_CARTES = {
    nationale: {
        titre: "🇫🇷 Carte nationale",
        image: "images/carte-nationale-mini.png",
        alt: "Carte nationale du réseau ferroviaire",
        apprendre: "national/apprendre-national.html",
        jouer: "national/jouer-national.html",
        examen: "national/examen-national.html"
    },

    rhoneAlpes: {
        titre: "🏔️ Rhône-Alpes",
        image: "images/carte-rhone-alpes-mini.png",
        alt: "Carte Rhône-Alpes du réseau ferroviaire",
        apprendre: "rhone-alpes/apprendre-rhone-alpes.html",
        jouer: "rhone-alpes/jouer-rhone-alpes.html",
        examen: "rhone-alpes/examen-rhone-alpes.html"
    }
};

function ouvrirChoixModes(cleCarte) {
    const configuration = CONFIG_CARTES[cleCarte];

    if (!configuration) return;

    carteSelectionnee = cleCarte;

    titreCarteSelectionnee.textContent =
        configuration.titre;

    imageCarteSelectionnee.src =
        configuration.image;

    imageCarteSelectionnee.alt =
        configuration.alt;

    ecranModes.classList.add("visible");
}

function fermerChoixModes() {
    ecranModes.classList.remove("visible");
    carteSelectionnee = null;
}

function ouvrirMode(nomMode) {
    if (!carteSelectionnee) return;

    const configuration =
        CONFIG_CARTES[carteSelectionnee];

    const destination =
        configuration[nomMode];

    if (!destination) return;

    window.location.href = destination;
}

btnCarteNationale.addEventListener(
    "click",
    function() {
        ouvrirChoixModes("nationale");
    }
);

btnCartesRegionales.addEventListener(
    "click",
    function() {
        ecranRegions.classList.add("visible");
    }
);

btnRetourAccueilRegions.addEventListener(
    "click",
    function() {
        ecranRegions.classList.remove("visible");
    }
);

btnRegionRhoneAlpes.addEventListener(
    "click",
    function() {
        ecranRegions.classList.remove("visible");
        ouvrirChoixModes("rhoneAlpes");
    }
);

btnRetourCartes.addEventListener(
    "click",
    function() {
        const carteAvantRetour = carteSelectionnee;

        fermerChoixModes();

        if (carteAvantRetour === "rhoneAlpes") {
            ecranRegions.classList.add("visible");
        }
    }
);

btnApprendre.addEventListener(
    "click",
    function() {
        ouvrirMode("apprendre");
    }
);

btnJouer.addEventListener(
    "click",
    function() {
        ouvrirMode("jouer");
    }
);

btnExamen.addEventListener(
    "click",
    function() {
        ouvrirMode("examen");
    }
);

/* =========================================================
   OUVERTURE DIRECTE APRÈS UN RETOUR DEPUIS UNE PAGE DE JEU
   ========================================================= */
const parametresAdresse = new URLSearchParams(window.location.search);
const ecranDemande = parametresAdresse.get("ecran");
const carteDemandee = parametresAdresse.get("carte");

if (ecranDemande === "regions") {
    ecranRegions.classList.add("visible");
}

if (
    ecranDemande === "modes" &&
    carteDemandee &&
    CONFIG_CARTES[carteDemandee]
) {
    ouvrirChoixModes(carteDemandee);
}

if (
    (ecranDemande === "regions" || ecranDemande === "modes") &&
    window.history &&
    window.history.replaceState
) {
    window.history.replaceState(
        {},
        document.title,
        window.location.pathname + window.location.hash
    );
}

</script>

</body>
</html>
